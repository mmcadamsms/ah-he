log_format operations escape=json '{"@timestamp":"$time_iso8601","level":"INFO","message":"HTTP request completed","http_status":"$status","http_method":"$request_method"}';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout operations;
    client_max_body_size 10m;
    location /api/v1/operations/ {
        proxy_pass http://web-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { return 404; }
    location /actuator/ { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
