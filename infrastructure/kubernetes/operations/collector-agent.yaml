extensions:
  file_storage:
    directory: /var/otelcol
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  filelog:
    include: [/var/log/pods/operations_*/*/*.log]
    exclude:
      - /var/log/pods/operations_otel-agent-*/*/*.log
      - /var/log/pods/operations_otel-gateway-*/*/*.log
    start_at: beginning
    include_file_path: true
    storage: file_storage
    operators:
      - id: container-parser
        type: container
      - id: application-json
        type: json_parser
        if: 'body matches "^\\{"'
        parse_from: body
        parse_to: attributes.app
        timestamp:
          parse_from: attributes.app["@timestamp"]
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
        severity:
          parse_from: attributes.app.level
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  transform:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"])
          - set(resource.attributes["deployment.environment.name"], "pilot")
          - set(body, attributes["app"]["message"]) where attributes["app"]["message"] != nil
          - set(attributes["event.name"], attributes["app"]["event.name"]) where attributes["app"]["event.name"] != nil
          - set(attributes["operation.id"], attributes["app"]["operation.id"]) where attributes["app"]["operation.id"] != nil
          - set(attributes["operation.action"], attributes["app"]["operation.action"]) where attributes["app"]["operation.action"] != nil
          - set(attributes["error.code"], attributes["app"]["error.code"]) where attributes["app"]["error.code"] != nil
          - keep_keys(attributes, ["event.name", "operation.id", "operation.action", "error.code"])
          - keep_keys(resource.attributes, ["service.name", "deployment.environment.name", "k8s.namespace.name"])
          - 'replace_pattern(body, "(?i)Bearer\\s+[A-Za-z0-9_.~+/=-]+", "Bearer [REDACTED]")'
  batch:
    send_batch_size: 256
    timeout: 5s
exporters:
  otlphttp/gateway:
    endpoint: http://otel-gateway:4318
    sending_queue:
      storage: file_storage
      queue_size: 10000
    retry_on_failure:
      max_elapsed_time: 0s
service:
  extensions: [file_storage, health_check]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, transform, batch]
      exporters: [otlphttp/gateway]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
