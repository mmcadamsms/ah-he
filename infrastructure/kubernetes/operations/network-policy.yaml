apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-operations
  namespace: operations
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {ahhe-monitoring: "true"}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 8081, protocol: TCP}
        - {port: 8888, protocol: TCP}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports: [{port: 443, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
  namespace: operations
spec:
  podSelector:
    matchLabels: {app: operations-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {ahhe-ingress: "true"}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app: web-api}}}]
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: operations
spec:
  podSelector:
    matchLabels: {app: web-api}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: operations-web}}}]
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-to-gateway
  namespace: operations
spec:
  podSelector:
    matchLabels: {app: otel-agent}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: otel-gateway}}}]
      ports: [{port: 4318, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-traffic
  namespace: operations
spec:
  podSelector:
    matchLabels: {app: otel-gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: otel-agent}}}]
      ports: [{port: 4318, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app: loki}}}]
      ports: [{port: 3100, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-private-ingress
  namespace: operations
spec:
  podSelector:
    matchLabels: {app: loki}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: otel-gateway}}}]
      ports: [{port: 3100, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {ahhe-monitoring: "true"}
          podSelector:
            matchLabels: {app: grafana}
      ports: [{port: 3100, protocol: TCP}]
