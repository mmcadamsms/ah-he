spring:
  application:
    name: background-worker
  main:
    web-application-type: servlet
server:
  port: 8081
operations:
  provider: ${OPERATIONS_PROVIDER:azure}
  business-id: ${OPERATIONS_BUSINESS_ID}
  worker-principal: ${OPERATIONS_WORKER_PRINCIPAL}
  table-endpoint: ${OPERATIONS_TABLE_ENDPOINT}
  blob-endpoint: ${OPERATIONS_BLOB_ENDPOINT}
  queue-endpoint: ${OPERATIONS_QUEUE_ENDPOINT}
  connection-string: ${OPERATIONS_CONNECTION_STRING:}
  poll-ms: ${OPERATIONS_POLL_MS:15000}
app:
  environment: ${APP_ENVIRONMENT:local}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,outbox
